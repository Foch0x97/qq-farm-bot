name: 发布 Docker 镜像

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_latest:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 已存在的版本标签，例如 v1.0.0
        required: true
        type: string
      publish_latest:
        description: 同时更新 latest 标签
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: 构建与验证 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: 校验版本
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable."
            exit 1
          fi
          echo "IMAGE=docker.io/$DOCKERHUB_USERNAME/qq-farm-bot" >> "$GITHUB_ENV"
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: docker/setup-buildx-action@v3
      - name: 构建 Docker 镜像
        run: |
          docker buildx build --load --platform "linux/$ARCH" -f core/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag qq-farm-bot:latest .
      - name: 验证 Compose 双服务
        env:
          FARM_IMAGE: qq-farm-bot:latest
        run: |
          docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --max-time 10 http://127.0.0.1:3007/api/game-version
          curl --fail --max-time 10 http://127.0.0.1:3007/ | grep -qi '<html'
      - name: 输出验证日志
        if: failure()
        run: |
          docker compose logs --no-color
          for container in $(docker compose ps -aq); do
            docker inspect --format '{{json .State.Health}}' "$container"
          done
      - name: 推送平台镜像
        run: |
          docker tag qq-farm-bot:latest "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"

  publish:
    name: 发布多架构镜像
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH_LATEST: ${{ inputs.publish_latest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 创建并检查多架构标签
        run: |
          set -euo pipefail
          image="docker.io/$DOCKERHUB_USERNAME/qq-farm-bot"
          tags=(--tag "$image:$VERSION")
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
