name: 发布二进制

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: 打包 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, target: node18-win-x64, executable: qq-farm-bot.exe }
          - { platform: linux-x64, runner: ubuntu-22.04, target: node18-linux-x64, executable: qq-farm-bot }
          - { platform: macos-x64, runner: macos-15-intel, target: node18-macos-x64, executable: qq-farm-bot }
          - { platform: macos-arm64, runner: macos-15, target: node18-macos-arm64, executable: qq-farm-bot }
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
      PKG_TARGET: ${{ matrix.target }}
      RELEASE_EXE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 构建可执行文件
        shell: bash
        run: pnpm -C core exec pkg . --no-bytecode --targets "$PKG_TARGET" --output "dist/bin/$RELEASE_EXE"
      - name: 归档并验证解包后的程序
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets "$RUNNER_TEMP/farm-check"
          archive="qq-farm-bot-$RELEASE_PLATFORM"
          if [[ "$RUNNER_OS" == Windows ]]; then
            powershell.exe -NoProfile -Command 'Compress-Archive -LiteralPath "core/dist/bin/$env:RELEASE_EXE" -DestinationPath "release-assets/qq-farm-bot-$env:RELEASE_PLATFORM.zip"; Expand-Archive -LiteralPath "release-assets/qq-farm-bot-$env:RELEASE_PLATFORM.zip" -DestinationPath "$env:RUNNER_TEMP/farm-check" -ErrorAction Stop'
          else
            tar -czf "release-assets/$archive.tar.gz" -C core/dist/bin "$RELEASE_EXE"
            tar -xzf "release-assets/$archive.tar.gz" -C "$RUNNER_TEMP/farm-check"
          fi
          node --input-type=module <<'JS'
          import { spawn } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { setTimeout } from 'node:timers/promises';

          const folder = resolve(process.env.RUNNER_TEMP, 'farm-check');
          const app = spawn(join(folder, process.env.RELEASE_EXE), [], {
            cwd: folder,
            env: { ...process.env, ADMIN_PORT: '30971' },
            stdio: 'inherit',
          });
          let startError;
          app.once('error', error => { startError = error; });
          try {
            const url = 'http://127.0.0.1:30971';
            for (let attempt = 0; attempt < 30; attempt++) {
              if (startError) throw startError;
              if (app.exitCode !== null) throw new Error(`程序提前退出 (${app.exitCode})`);
              const version = await fetch(`${url}/api/game-version`).catch(() => null);
              if (version?.ok) {
                const html = await fetch(url).then(response => response.text());
                if (!html.includes('<html') || !existsSync(join(folder, 'data'))) {
                  throw new Error('面板页面或默认数据目录缺失');
                }
                process.exitCode = 0;
                break;
              }
              await setTimeout(1000);
            }
            if (process.exitCode !== 0) throw new Error('等待面板启动超时');
          } finally {
            app.kill();
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  docker:
    name: 发布 Docker 镜像
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
      publish_latest: true

  publish:
    name: 发布到 GitHub Releases
    needs: [package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets
      - name: 生成校验文件并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/$RELEASE_TAG.md"
          test -s "$notes"
          (
            cd release-assets
            sha256sum *.zip *.tar.gz > checksums.txt
          )
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "QQ 农场助手 $RELEASE_TAG" --notes-file "$notes" release-assets/*
