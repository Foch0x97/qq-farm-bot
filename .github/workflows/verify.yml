name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C core test
      - run: pnpm typecheck:web
      - run: pnpm -C web test
      - run: pnpm build
